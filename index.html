<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Rig Viewer</title>
<style>
  /* Zelená je odvozená z palety Rig Manageru: jejich Colors.txt má výběr
     rgb(100,135,113) a ikona stojí na #1B705B. Je to odstín 165°, takže
     pro tmavý podklad je zesvětlený a pro světlý se bere ten původní tmavý. */
  :root{
    --bg:#0b0d10; --panel:#15191f; --panel2:#1c2128; --line:#2a313b;
    --fg:#f2f5f8; --dim:#8b95a3; --off:#3a424e;
    --accent:#3bcea9; --onAccent:#04211a;
    --on:#3bcea9; --onBg:#122b25; --onBorder:#2c7a65;
    --flat:#4da3ff; --sharp:#ff5d5d;
    --overlay:rgba(8,10,13,.985); --scrim:rgba(6,8,11,.82); --lockBg:#123029;
    --mono:#0f1216; --monoFg:#9fb0c3; --monoTx:#6f8bb0; --monoRx:#8fd3a8;
    /* Barvy bank podle Playeru; cyklí se po pěti. LED svítí syté
       (0,0,255 / 255,255,0 / …), na displeji by to bylo nečitelné, proto
       jsou přeladěné na stejný odstín s použitelným jasem. */
    --bank1:#5b8cff; --bank2:#e3c341; --bank3:#ff5d5d;
    --bank4:#5be07a; --bank5:#d96bc6;
    color-scheme:dark;
  }
  /* světlá varianta: platí podle systému, pokud si uživatel nevynutil tmavou */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#eef1f4; --panel:#ffffff; --panel2:#f3f5f8; --line:#d3dae2;
      --fg:#111820; --dim:#5d6773; --off:#c3cbd4;
      --accent:#1b705b; --onAccent:#ffffff;
      --on:#1b705b; --onBg:#dff0ea; --onBorder:#1b705b;
      --flat:#1f6fd0; --sharp:#c62828;
      --overlay:rgba(238,241,244,.985); --scrim:rgba(40,48,58,.38); --lockBg:#d8ece5;
      --mono:#f7f9fb; --monoFg:#44505e; --monoTx:#2f5d8f; --monoRx:#166b56;
      --bank1:#1b46c8; --bank2:#8a6b00; --bank3:#c62828;
      --bank4:#1f7a3a; --bank5:#9a1e7a;
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#eef1f4; --panel:#ffffff; --panel2:#f3f5f8; --line:#d3dae2;
    --fg:#111820; --dim:#5d6773; --off:#c3cbd4;
    --accent:#1b705b; --onAccent:#ffffff;
    --on:#1b705b; --onBg:#dff0ea; --onBorder:#1b705b;
    --flat:#1f6fd0; --sharp:#c62828;
    --overlay:rgba(238,241,244,.985); --scrim:rgba(40,48,58,.38); --lockBg:#d8ece5;
    --mono:#f7f9fb; --monoFg:#44505e; --monoTx:#2f5d8f; --monoRx:#166b56;
    --bank1:#1b46c8; --bank2:#8a6b00; --bank3:#c62828;
    --bank4:#1f7a3a; --bank5:#9a1e7a;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:16px/1.3 system-ui,-apple-system,Roboto,sans-serif;
    overscroll-behavior:none;user-select:none;touch-action:manipulation}
  body{display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button,select{font:inherit}

  /* ---- horni lista ---- */
  /* z-index nad ladičkou: na ⚙ se musí dát dosáhnout za všech okolností */
  header{display:flex;align-items:center;gap:10px;padding:8px 12px;flex:0 0 auto;
    border-bottom:1px solid var(--line);position:relative;z-index:35;background:var(--bg)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--off);flex:0 0 auto;transition:background .2s}
  .dot.live{background:var(--on);box-shadow:0 0 10px var(--on)}
  .dot.warn{background:var(--accent)}
  #status{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
  header .sp{flex:1}
  .ico{background:none;border:0;color:var(--dim);padding:8px 10px;font-size:18px;line-height:1}
  .ico:active{color:var(--fg)}
  /* Textová tlačítka místo ikon - dingbaty jako ✎ se na Androidu nemusí
     vykreslit vůbec a malý šedý glyph se přehlédne. */
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;
    letter-spacing:.04em;line-height:1;white-space:nowrap}
  .pill.act{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
  .pill.lock{background:var(--lockBg);border-color:var(--accent);color:var(--accent)}

  main{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px;gap:12px}

  /* ---- aktualni rig ---- */
  .rig{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:14px 20px;display:flex;align-items:center;gap:18px;flex:0 0 auto;
    position:relative;overflow:hidden}
  /* svislý pruh v barvě banky - na pódiu je to vidět i koutkem oka */
  .rig::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
    background:var(--bank,transparent);transition:background .15s}
  .rig .id{font-variant-numeric:tabular-nums;font-size:clamp(26px,6vw,58px);font-weight:700;
    color:var(--bank,var(--accent));line-height:1;min-width:3ch;text-align:center}
  .rig .name{font-size:clamp(24px,6vw,64px);font-weight:650;letter-spacing:-.015em;line-height:1.05;
    flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rig .meta{font-size:11px;color:var(--dim);text-align:right;white-space:nowrap}

  /* ---- slot dlazdice ---- */
  /* pruh s obsahem banky - pět rigů vedle sebe, aktuální zvýrazněný */
  .banklist{display:flex;gap:7px;flex:0 0 auto}
  .banklist div{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:7px 9px;font-size:12px;color:var(--dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .banklist div b{font-variant-numeric:tabular-nums;margin-right:6px;opacity:.65}
  .banklist div.cur{color:var(--fg);border-color:var(--bank,var(--accent));
    background:var(--panel2)}
  .banklist div.cur b{color:var(--bank,var(--accent));opacity:1}

  .slots{flex:1;display:grid;gap:9px;min-height:0;
    grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}
  @media (max-width:700px){.slots{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr)}}
  .slot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px;
    display:flex;flex-direction:column;justify-content:space-between;min-height:70px;
    position:relative;overflow:hidden;transition:background .12s,border-color .12s,opacity .12s}
  .slot .lbl{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.14em}
  .slot .type{font-size:clamp(14px,2.3vw,22px);font-weight:600;line-height:1.15;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .slot .tid{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;opacity:.7}
  .slot.empty{opacity:.3}
  .slot.on{background:linear-gradient(180deg,var(--onBg),var(--panel));border-color:var(--onBorder)}
  .slot.on .lbl{color:var(--on)}
  .slot.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--on)}
  .slot:active{transform:scale(.97);filter:brightness(1.25)}
  .slots.edit .slot{border-style:dashed;border-color:var(--accent)}
  .slots.edit .slot:not(.empty)::after{content:"✏️";position:absolute;top:7px;right:9px;
    font-size:13px}


  /* ---- ladicka ---- */
  .tuner{position:fixed;inset:0;background:var(--overlay);z-index:30;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px}
  .tuner.show{display:flex}
  .tuner .note{font-size:clamp(90px,25vh,260px);font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
  .tuner .bar{width:min(92vw,820px);height:54px;background:var(--panel2);border:1px solid var(--line);
    border-radius:12px;position:relative;overflow:hidden}
  .tuner .bar .center{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--dim);transform:translateX(-50%)}
  .tuner .bar .needle{position:absolute;top:4px;bottom:4px;width:14px;border-radius:7px;background:var(--on);
    left:50%;transform:translateX(-50%);transition:left .06s linear,background .12s}
  .tuner .cents{color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
  .tuner .esc{position:absolute;bottom:24px;left:0;right:0;text-align:center;
    color:var(--dim);font-size:13px}

  /* ---- prekryvy ---- */
  .sheet{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none;
    align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
  .sheet.show{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;
    width:min(680px,100%);display:flex;flex-direction:column;gap:14px}
  .card h2{margin:0;font-size:16px;letter-spacing:.02em}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row label{font-size:12px;color:var(--dim);min-width:96px}
  select,input,textarea,.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;font-size:14px;flex:1;min-width:0}
  .btn{flex:0 0 auto;text-align:center}
  .btn:active{background:var(--line)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent);font-weight:600}
  textarea{font:11px/1.5 ui-monospace,Menlo,monospace;min-height:110px;resize:vertical}
  .mon{background:var(--mono);border:1px solid var(--line);border-radius:10px;padding:9px;max-height:30vh;
    overflow:auto;font:10px/1.45 ui-monospace,Menlo,monospace;color:var(--monoFg);white-space:pre-wrap;word-break:break-all}
  .mon .tx{color:var(--monoTx)} .mon .rx{color:var(--monoRx)}
  .note-sm{font-size:12px;color:var(--dim);line-height:1.5}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <span id="status" data-i18n="st.disconnected">odpojeno</span>
  <span class="sp"></span>
  <button class="pill" id="editBtn">názvy</button>
  <button class="pill" id="lockBtn">odemčeno</button>
  <button class="ico" id="fsBtn" data-i18n-title="title.fullscreen">⛶</button>
  <button class="ico" id="cfgBtn" data-i18n-title="title.settings">⚙</button>
</header>

<main>
  <div class="rig">
    <div class="id" id="rigId">–</div>
    <div class="name" id="rigName">Rig Viewer</div>
    <div class="meta" id="rigMeta"></div>
  </div>
  <div class="banklist" id="banklist" hidden></div>
  <div class="slots" id="slots"></div>
</main>

<!-- ladicka -->
<div class="tuner" id="tuner">
  <div class="note" id="tNote">–</div>
  <div class="bar"><div class="center"></div><div class="needle" id="tNeedle"></div></div>
  <div class="cents" id="tCents"></div>
  <div class="esc" data-i18n="tuner.close"></div>
</div>

<!-- nastaveni -->
<div class="sheet" id="cfg">
  <div class="card">
    <div class="row"><h2 data-i18n="set.title"></h2><span class="sp" style="flex:1"></span>
      <button class="btn" id="cfgClose" data-i18n="set.close"></button></div>

    <div class="row"><label data-i18n="set.theme"></label>
      <select id="themeSel">
        <option value="system" data-i18n="set.themeSystem"></option>
        <option value="light"  data-i18n="set.themeLight"></option>
        <option value="dark"   data-i18n="set.themeDark"></option>
      </select></div>

    <div class="row"><label data-i18n="set.language"></label>
      <select id="langSel">
        <option value="cs">Čeština</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select></div>

    <div id="portRow">
      <div class="row"><label data-i18n="set.midiIn"></label><select id="inSel"></select></div>
      <div class="row"><label data-i18n="set.midiOut"></label><select id="outSel"></select></div>
    </div>
    <div class="row" id="devRow" hidden><label data-i18n="set.device"></label>
      <span class="note-sm" style="flex:1" id="devName">–</span>
      <button class="btn" id="rescanBtn" data-i18n="set.rescan"></button></div>
    <div class="mon" id="ports" hidden></div>
    <div class="row"><label data-i18n="set.deviceType"></label>
      <select id="prodSel">
        <option value="2">Profiler Player</option>
        <option value="0">Profiler (Stage/Head/Rack)</option>
      </select></div>

    <div class="note-sm" id="wlNote"></div>

    <div class="row"><label data-i18n="set.fxNames"></label>
      <button class="btn" id="fxClear" data-i18n="set.clearAll"></button>
      <button class="btn" id="fxCopy" data-i18n="set.copy"></button></div>
    <textarea id="fxJson" spellcheck="false" placeholder='{"33":"Green Scream","113":"Hall Reverb"}'></textarea>
    <div class="note-sm" data-i18n="set.fxHint"></div>

    <div class="row"><label data-i18n="set.banklist"></label>
      <button class="btn" id="blBtn">–</button>
      <span class="note-sm" style="flex:1" data-i18n="set.banklistHint"></span></div>

    <div class="row"><label data-i18n="set.tuner"></label>
      <button class="btn" id="tunBtn">–</button>
      <span class="note-sm" style="flex:1" data-i18n="set.tunerHint"></span></div>

    <div class="row"><label data-i18n="set.channel"></label>
      <select id="chSel"></select>
      <span class="note-sm" style="flex:1" data-i18n="set.channelHint"></span></div>

    <div class="row"><label data-i18n="set.traffic"></label>
      <span class="note-sm" style="flex:1" id="stats">–</span></div>

    <div class="row"><label data-i18n="set.midiLog"></label><button class="btn" id="monBtn" data-i18n="set.onOff"></button></div>
    <div class="mon" id="mon" style="display:none"></div>
  </div>
</div>

<!-- pojmenovani efektu -->
<div class="sheet" id="nameDlg">
  <div class="card">
    <h2 id="nameTitle" data-i18n="dlg.nameEffect"></h2>
    <input id="nameInput" data-i18n-ph="dlg.placeholder" spellcheck="false">
    <div class="row"><span style="flex:1"></span>
      <button class="btn" id="nameCancel" data-i18n="dlg.cancel"></button>
      <button class="btn pri" id="nameSave" data-i18n="dlg.save"></button></div>
  </div>
</div>

<script>
/* ==========================================================================
   Kemper NRPN / SysEx
   F0 00 20 33 <product> <device> <func> <instance> <page> <param> [data] F7
   ========================================================================== */
const MFG = [0x00,0x20,0x33], DEVICE = 0x7f, INSTANCE = 0x00;
const FN  = { SET:0x01, REQ_PARAM:0x41, REQ_STRING:0x43, RESP_PARAM:0x01, RESP_STRING:0x03,
              BEACON:0x7e,
              // Tyhle dvě v dokumentaci nejsou, vypadly až z odposlechu:
              RESP_PARAM_NAMED:0x3c,  // parametr i s jeho jménem
              RESP_EXT_STRING:0x07 }; // rozšířený řetězec (obsah banky)

const PARAM_SET = 0x02;   // sada: rig name + slot type/state + tuner
const LEASE_SEC = 10;     // beacon lease; preposilat po polovine
const POLL_MS   = 15000;  // Záloha, ne hlavní kanál. Beacon posílá změny sám;
                          // tohle jen podchytí přepnutí rigu přímo na přístroji,
                          // které neposílá Program Change. Při 3 s to dělalo
                          // 6 odpovědí/s, což je zbytečný provoz.
let BANKLIST = LS_BOOT('banklist', true);   // pruh s obsahem banky
let TUNER_ON = LS_BOOT('tuner', false);   // bit 5 beaconu = posílej data ladičky.
   // Default vypnuto: Player pak hlásil tuner mode = on a celoobrazovková
   // ladička překryla rig, přičemž nota ani odchylka nikdy nepřišly.
const FLAGS = init => (init?1:0) | (1<<1) /*sysex*/ | (TUNER_ON ? (1<<5) : 0);

// cc = CC pro zap/vyp slotu; DLY/REV ve verzi se spilloverem, aby dozněly
const SLOTS = [
  {key:'A',page:0x32,cc:17},{key:'B',page:0x33,cc:18},
  {key:'C',page:0x34,cc:19},{key:'D',page:0x35,cc:20},
  {key:'X',page:0x38,cc:22},{key:'MOD',page:0x3a,cc:24},
  {key:'DLY',page:0x3c,cc:27},{key:'REV',page:0x3d,cc:29},
];
const P_TYPE=0x00, P_STATE=0x03;
const PAGE_STRINGS=0x00, S_RIG_NAME=0x01, S_RIG_DATE=0x03;
const TUNER = { mode:[0x7f,0x7e], note:[0x7d,0x54], dev:[0x7c,0x0f] };

/* ================================ stav ================================== */
const el = id => document.getElementById(id);
function LS_BOOT(k, d){ try{ const v=localStorage.getItem('khud.'+k);
  return v==null ? d : JSON.parse(v); }catch(e){ return d; } }
const LS = {
  get:(k,d)=>{ try{ const v=localStorage.getItem('khud.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set:(k,v)=>{ try{ localStorage.setItem('khud.'+k, JSON.stringify(v)); }catch(e){} }
};
let PRODUCT = LS.get('product', 2);
let CHANNEL = LS.get('channel', 1);      // MIDI kanál, na kterém Player poslouchá
let LOCKED  = LS.get('locked', false);   // zámek proti nechtěnému šlápnutí
let fxNames = LS.get('fx', {});      // ruční, mají přednost
let fxAuto  = LS.get('fxauto', {});  // co poslal Kemper sám
const state = { rigName:'', rigDate:'', pc:null, bankMsb:null, slots:{},
                tuner:{on:false,note:0,dev:8192},
                bank:{ name:'', rigs:[] } };
let beaconT=null, pollT=null, wdT=null, wakeLock=null;
let lastRx=0;        // cokoliv z přístroje (i Active Sensing)
let lastSysex=0;     // skutečná SysEx odpověď od Kemperu
let lastTuner=0;     // poslední nota / odchylka z ladičky
let tunerMuted=0;    // kdy uživatel ladičku odklepl
let wakeState=null;  // 'on' | 'off' | null
let rxCount=0, rateCount=0, rxRate=0;
const traffic = {};                  // co vlastně chodí, podle adresy
const bump = k => traffic[k] = (traffic[k]||0)+1;
function trafficLabel(k){
  const [kind, arg] = k.split(':');
  switch(kind){
    case 'rigName':   return t('tr.rigName');
    case 'rigDate':   return t('tr.rigDate');
    case 'string':    return t('tr.string', arg);
    case 'slotType':  return t('tr.slotType', arg);
    case 'slotState': return t('tr.slotState', arg);
    case 'tunerMode': return t('tr.tunerMode');
    case 'tunerNote': return t('tr.tunerNote');
    case 'tunerDev':  return t('tr.tunerDev');
    case 'bankList':  return t('tr.bankList');
    case 'unknown':   return t('tr.unknown', arg);
    default:          return k;
  }
}


/* ============================== jazyky ==================================
   Klíče jsou stabilní, texty se mění. Fallback: neznámý jazyk -> angličtina,
   chybějící klíč -> anglický text, a teprve pak samotný klíč.
   ====================================================================== */
const I18N = {
cs:{
 'st.disconnected':'odpojeno','st.connected':'připojeno',
 'st.aliveNoAnswer':'přístroj žije, ale neodpovídá','st.silent':'ticho na lince',
 'st.pickPorts':'vyber MIDI vstup i výstup','st.connectUsb':'připoj Player přes USB',
 'st.searching':'hledám Player…','st.noWebMidi':'Web MIDI nedostupné','st.noMidi':'MIDI nedostupné',
 'msg.iosApp':'na iOS otevři nativní aplikaci','dev.notConnected':'Player nepřipojen',
 'btn.names':'názvy','btn.namesOn':'názvy: zapnuto','btn.unlocked':'odemčeno','btn.locked':'zamčeno',
 'title.fullscreen':'Celá obrazovka','title.settings':'Nastavení',
 'tuner.close':'klepnutím zavřeš',
 'set.title':'Nastavení','set.close':'Zavřít','set.language':'Jazyk',
 'set.theme':'Motiv','set.themeSystem':'podle systému','set.themeLight':'světlý','set.themeDark':'tmavý',
 'set.midiIn':'MIDI vstup','set.midiOut':'MIDI výstup','set.choose':'— vyber —',
 'set.device':'Zařízení','set.deviceType':'Typ přístroje',
 'set.rescan':'hledat znovu','set.noPorts':'systém nevidí žádné MIDI zařízení',
 'set.fxNames':'Názvy efektů','set.clearAll':'Smazat vše','set.copy':'Kopírovat',

let LANG = LS_BOOT('lang', null) || (navigator.language || 'en').slice(0,2).toLowerCase();
if(!I18N[LANG]) LANG = 'en';

function t(key, ...args){
  let str = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
  args.forEach((v,i)=> str = str.split('{'+i+'}').join(v));
  return str;
}

let THEME = LS_BOOT('theme', 'system');   // 'system' | 'light' | 'dark'

function applyTheme(){
  const root = document.documentElement;
  if(THEME === 'system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', THEME);
  // barvu lišty systému srovnáme s pozadím, ať nesvítí v druhém motivu
  const bg = getComputedStyle(root).getPropertyValue('--bg').trim();
  const meta = el('themeColor');
  if(meta) meta.setAttribute('content', bg);
}

function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(e=> e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(e=> e.title = t(e.dataset.i18nTitle));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=> e.placeholder = t(e.dataset.i18nPh));
  el('themeSel').value = THEME;
  lockLabel(); editLabel(); tunLabel(); blLabel(); stats(); render();
  if(Transport.kind === 'web' && midiAccess) fillPorts();
  keepAwakeNote();
}

/* ================================ MIDI ================================== */
function log(dir, bytes){
  if(dir==='rx' && (bytes[0]===0xfe || bytes[0]===0xf8)) return;   // Active Sensing / Clock
  const m = el('mon'); if(m.style.display==='none') return;
  m.insertAdjacentHTML('afterbegin',
    `<div class="${dir}">${dir==='tx'?'→':'←'} ${[...bytes].map(b=>b.toString(16).padStart(2,'0')).join(' ')}</div>`);
  while(m.childElementCount>150) m.lastElementChild.remove();
}
const sysex = (fn,tail)=>[0xf0,...MFG,PRODUCT,DEVICE,fn,INSTANCE,...tail,0xf7];
// Posílá se přes Transport, ne přímo do Web MIDI portu - na iOS Web MIDI
// neexistuje a data chodí přes nativní most z WKWebView.
function send(b){ if(!Transport.ready) return; try{ Transport.send(b); log('tx',b); }catch(e){} }
const reqParam  = (page,param)=>send(sysex(FN.REQ_PARAM,[page,param]));
const reqString = id=>send(sysex(FN.REQ_STRING,[PAGE_STRINGS,id]));
const beacon    = (init=false)=>send(sysex(FN.BEACON,[0x40,PARAM_SET,FLAGS(init),LEASE_SEC/2|0]));
const cc        = (num,val)=>send([0xb0 | ((CHANNEL-1)&0x0f), num, val]);

function toggleSlot(key){
  const slot = SLOTS.find(s=>s.key===key);
  const st = state.slots[key];
  if(!slot || !st || !st.type) return;          // prázdný slot nemá co vypínat
  const want = !st.on;
  cc(slot.cc, want ? 1 : 0);
  st.on = want; render();                       // okamžitá odezva
  // za chvíli si vyžádáme skutečný stav; kdyby to neprošlo, dlaždice se vrátí
  setTimeout(()=>reqParam(slot.page, P_STATE), 150);
}

function refreshAll(){
  reqString(S_RIG_NAME); reqString(S_RIG_DATE);
  SLOTS.forEach(s=>{ reqParam(s.page,P_TYPE); reqParam(s.page,P_STATE); });
}
function start(){
  [beaconT,pollT,wdT].forEach(clearInterval);
  beacon(true); refreshAll();
  beaconT = setInterval(()=>beacon(false), LEASE_SEC*500);
  pollT   = setInterval(refreshAll, POLL_MS);
  wdT     = setInterval(()=>{
    rxRate = rateCount / 0.7; rateCount = 0;       // zpráv za sekundu
    const sx = Date.now()-lastSysex, any = Date.now()-lastRx;
    if(sx < 20000)      setStatus('live', t('st.connected'));
    else if(any < 2000) setStatus('warn', t('st.aliveNoAnswer'));
    else                setStatus('off',  t('st.silent'));
    if(sx > 20000) beacon(true);          // neodpovídá -> znovu init
    if(el('cfg').classList.contains('show')) stats();
  }, 700);
}

function onMidi(e){
  const d = e.data; lastRx = Date.now(); log('rx',d);

  if(d[0]===0xf0){
    if(d[1]!==MFG[0]||d[2]!==MFG[1]||d[3]!==MFG[2]) return;
    const fn=d[6], page=d[8], param=d[9];
    if(fn===FN.BEACON) return;                        // sense tick (~500 ms)
    lastSysex = Date.now(); rxCount++; rateCount++;

    // Parametr i se jménem. Díky tomu se názvy efektů nemusí vyklikávat ručně.
    if(fn===FN.RESP_PARAM_NAMED){
      const val = (d[10]<<7) | d[11];
      const nm  = String.fromCharCode(...d.slice(12, d.length-1))
                    .replace(/[^\x20-\x7e]/g,'').trim();
      const slot = SLOTS.find(x=>x.page===page);
      if(slot && param===P_TYPE){
        (state.slots[slot.key] ||= {type:0,on:false}).type = val;
        if(nm && nm !== '-'){
          if(fxAuto[val] !== nm){ fxAuto[val] = nm; LS.set('fxauto', fxAuto); }
        }
        bump('slotType:'+slot.key);
        return render();
      }
      return;
    }

    // Obsah celé banky: index 0 je název banky, 1 až 5 jsou rigy.
    if(fn===FN.RESP_EXT_STRING && d[8]===0x00 && d[9]===0x00 && d[10]===0x01){
      const idx = d[12];
      const txt = String.fromCharCode(...d.slice(13, d.length-1))
                    .replace(/[^\x20-\x7e]/g,'').trim();
      if(idx === 0) state.bank.name = txt;
      else state.bank.rigs[idx-1] = txt;
      bump('bankList');
      return render();
    }

    if(fn===FN.RESP_STRING && page===PAGE_STRINGS){
      const txt = String.fromCharCode(...d.slice(10,d.length-1)).replace(/[^\x20-\x7e]/g,'').trim();
      if(param===S_RIG_NAME){ state.rigName=txt; bump('rigName'); }
      else if(param===S_RIG_DATE){ state.rigDate=txt; bump('rigDate'); }
      else bump('string:'+param.toString(16));
      return render();
    }
    if(fn===FN.RESP_PARAM){
      const val = (d[10]<<7) | (d[11]||0);
      const slot = SLOTS.find(s=>s.page===page);
      if(slot){
        const s = state.slots[slot.key] ||= {type:0,on:false};
        if(param===P_TYPE)  { s.type = val; bump('slotType:'+slot.key); }
        if(param===P_STATE) { s.on = val>0; bump('slotState:'+slot.key); }
        return render();
      }
      if(page===TUNER.mode[0]&&param===TUNER.mode[1]){
        bump('tunerMode');
        if(!(val>0)) tunerMuted = 0;          // ladička vypnuta -> reset ztišení
        state.tuner.on = val>0; return render(); }
      if(page===TUNER.note[0]&&param===TUNER.note[1]){
        bump('tunerNote');
        state.tuner.note=val; lastTuner=Date.now(); return render(); }
      if(page===TUNER.dev[0] &&param===TUNER.dev[1] ){
        bump('tunerDev');
        state.tuner.dev=val;  lastTuner=Date.now(); return render(); }
      bump('unknown:'+page.toString(16)+'/'+param.toString(16));
    }
    return;
  }
  const st = d[0]&0xf0;
  if(st===0xb0 && d[1]===32){ state.bankMsb=d[2]; return; }   // rig index MSB
  if(st===0xc0){ state.pc=d[1]; setTimeout(refreshAll,60); render(); }
}

/* =============================== render ================================= */
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const fxLabel = id => id===0 ? '—' : (fxNames[id] || fxAuto[id] || t('fx.type', id));

function render(){
  el('rigName').textContent = state.rigName || '—';
  el('rigMeta').textContent = state.rigDate || '';
  const rigRow = document.querySelector('.rig');
  if(state.pc==null){
    el('rigId').textContent = '–';
    rigRow.style.removeProperty('--bank');
  } else {
    const i = (state.bankMsb||0)*128 + state.pc;
    const bank = Math.floor(i/5);
    el('rigId').textContent = `${bank+1}-${i%5+1}`;
    // Player cyklí pět barev: modrá, žlutá, červená, světle zelená, purpurová
    rigRow.style.setProperty('--bank', `var(--bank${bank % 5 + 1})`);
  }

  // pruh s obsahem banky
  const bl = el('banklist');
  const rigInBank = state.pc==null ? -1 : ((state.bankMsb||0)*128 + state.pc) % 5;
  if(BANKLIST && state.bank.rigs.length){
    bl.hidden = false;
    bl.style.setProperty('--bank', rigRow.style.getPropertyValue('--bank') || '');
    bl.innerHTML = state.bank.rigs.map((n,i)=>
      `<div class="${i===rigInBank?'cur':''}"><b>${i+1}</b>${n||'—'}</div>`).join('');
  } else bl.hidden = true;

  SLOTS.forEach(s=>{
    const box=el('slot-'+s.key), st=state.slots[s.key]||{type:0,on:false};
    box.className = 'slot' + (st.type===0?' empty':(st.on?' on':''));
    box.querySelector('.type').textContent = fxLabel(st.type);
    box.querySelector('.tid').textContent  = st.type ? '#'+st.type : '';
  });

  // Ladička je default VYPNUTÁ a pak se nezobrazí nikdy, ať Player posílá
  // cokoliv. Samotné shození bitu 5 v beaconu totiž nestačí - parametrická
  // sada 2, kterou si vyžádám kvůli názvu rigu a slotům, tuner data obsahuje
  // taky, takže chodí i bez vyžádání.
  // Když si ji někdo zapne: potřebuje skutečnou notu nebo odchylku (jinak by
  // přebila rig prázdným "C / 0 ct") a vždycky se dá odklepnout.
  const live = TUNER_ON
            && state.tuner.on
            && (Date.now() - lastTuner < 1500)
            && (Date.now() - tunerMuted > 20000);
  const t=el('tuner'); t.classList.toggle('show', live);
  if(live){
    el('tNote').textContent = NOTES[state.tuner.note%12] ?? '–';
    const c = Math.round((state.tuner.dev-8192)/8192*50);
    el('tCents').textContent = (c>0?'+':'')+c+' ct';
    const n=el('tNeedle');
    n.style.left = Math.max(2,Math.min(98,50+c))+'%';
    n.style.background = Math.abs(c)<=2 ? 'var(--on)' : (c<0?'var(--flat)':'var(--sharp)');
  }
}
function setStatus(kind,txt){
  el('dot').className='dot'+(kind==='live'?' live':kind==='warn'?' warn':'');
  el('status').textContent=txt;
}

/* fullscreen + landscape + wake lock (vyzaduje gesto uzivatele) */
async function goStage(){
  try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); }catch(e){}
  try{ await screen.orientation.lock('landscape'); }catch(e){}
  await keepAwake();
}
function keepAwakeNote(){
  el('wlNote').textContent = wakeState ? t('wake.'+wakeState) : '';
}
async function keepAwake(){
  try{
    if('wakeLock' in navigator && (!wakeLock || wakeLock.released)){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeState = 'on';
    }
  }catch(e){ wakeState = 'off'; }
  keepAwakeNote();
}
function lockLabel(){
  el('lockBtn').textContent = t(LOCKED ? 'btn.locked' : 'btn.unlocked');
  el('lockBtn').className = 'pill' + (LOCKED ? ' lock' : '');
}
el('lockBtn').onclick = ()=>{ LOCKED=!LOCKED; LS.set('locked',LOCKED); lockLabel(); };
lockLabel();
editLabel();
function flashLock(){
  const b = el('lockBtn');
  b.animate([{transform:'scale(1)'},{transform:'scale(1.5)'},{transform:'scale(1)'}],
            {duration:260});
}
el('fsBtn').onclick = goStage;
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') keepAwake(); });
addEventListener('click', function once(){ keepAwake(); removeEventListener('click',once); });

/* ========================== transportní vrstva ==========================
   Jedna a tatáž stránka jede ve dvou světech:
     web    - Chrome na Androidu / desktopu, Web MIDI
     native - iOS aplikace, WKWebView + CoreMIDI přes most
   Zbytek kódu o tom neví a volá jen Transport.send().
   ====================================================================== */
const Transport = { kind:'none', ready:false, send(){} };

/* ---------- nativní most (iOS) ---------- */
function initNative(){
  const port = window.webkit.messageHandlers.kemper;
  Transport.kind = 'native';
  Transport.send = b => port.postMessage({op:'send', bytes:[...b]});

  // volá nativní strana
  window.__midiIn = arr => onMidi({data: Uint8Array.from(arr)});
  el('rescanBtn').onclick = ()=> port.postMessage({op:'rescan'});

  // výpis všeho, co CoreMIDI vidí - bez toho se nedá poznat, jestli systém
  // zařízení nevidí vůbec, nebo jen neprošlo hledáním podle jména
  window.__midiPorts = payload => {
    const list = payload.ports || [], h = payload.health || {};
    const p = el('ports');
    p.hidden = false;
    const head = `<div class="tx">zdrojů ${h.sources} · cílů ${h.destinations} · `
               + `zařízení ${h.devices} · hledání ${h.scans}×</div>`
               + (h.client ? `<div class="rx">CoreMIDI klient chyba ${h.client}</div>` : '');
    const devs = (payload.devices || []).map(d => {
      const off = d.offline ? '<span class="tx">offline</span>' : '<span class="rx">online</span>';
      const bits = [d.name || '(bez jména)', d.maker, d.model].filter(Boolean).join(' · ');
      const ents = (d.entities || []).map(e =>
        `<div>&nbsp;&nbsp;entita ${e.name || ''}: in ${e.sources} / out ${e.destinations}`
        + (e.offline ? ' <span class="tx">offline</span>' : '') + '</div>').join('');
      return `<div>▸ ${bits} — ${off}</div>` + ents;
    }).join('');

    p.innerHTML = head + devs + (list.length
      ? list.map(d => {
          const mark = d.active ? '<span class="rx">● </span>' : '<span class="tx">○ </span>';
          const bits = [d.name || '(bez jména)', d.maker, d.model].filter(Boolean).join(' · ');
          return `<div>${mark}${d.kind} ${d.index}: ${bits}${d.matched ? ' ✓' : ''}</div>`;
        }).join('')
      : `<div>${t('set.noPorts')}</div>`);
  };

  window.__midiDevice = (nameOrNull) => {
    Transport.ready = !!nameOrNull;
    el('portRow').hidden = true;
    el('devName').textContent = nameOrNull || t('dev.notConnected');
    if(nameOrNull) start();
    else { [beaconT,pollT,wdT].forEach(clearInterval);
           setStatus('off', t('st.connectUsb')); }
  };
  el('portRow').hidden = true;
  el('devRow').hidden = false;
  setStatus('off', t('st.searching'));
  port.postMessage({op:'hello'});
}

/* ---------- Web MIDI (Android, desktop) ---------- */
let midiAccess = null, input = null, output = null;

function fillPorts(){
  const ins=[...midiAccess.inputs.values()], outs=[...midiAccess.outputs.values()];
  const opt = p=>`<option value="${p.id}">${p.name}</option>`;
  const none = `<option value="">${t('set.choose')}</option>`;
  el('inSel').innerHTML  = none + ins.map(opt).join('');
  el('outSel').innerHTML = none + outs.map(opt).join('');

  const pick = (list, saved) => list.find(p=>p.id===saved)
                             || list.find(p=>/kemper|profiler|player/i.test(p.name));
  const gi = pick(ins, LS.get('in')), go = pick(outs, LS.get('out'));
  if(gi){ el('inSel').value=gi.id;  useIn(gi.id); }
  if(go){ el('outSel').value=go.id; useOut(go.id); }
  if(!gi||!go) setStatus('off', t('st.connectUsb'));
}
function useIn(id){
  if(input) input.onmidimessage=null;
  input = midiAccess.inputs.get(id)||null;
  if(input){ input.onmidimessage=onMidi; LS.set('in',id); }
  webReady();
}
function useOut(id){ output = midiAccess.outputs.get(id)||null; if(output) LS.set('out',id); webReady(); }
function webReady(){
  Transport.ready = !!(input && output);
  if(Transport.ready) start();
  else setStatus('off', t('st.pickPorts'));
}

function initWebMidi(){
  Transport.kind = 'web';
  Transport.send = b => output && output.send(b);
  el('inSel').onchange  = e=>useIn(e.target.value);
  el('outSel').onchange = e=>useOut(e.target.value);
  navigator.requestMIDIAccess({sysex:true}).then(a=>{
    midiAccess=a; a.onstatechange=fillPorts; fillPorts();
  }).catch(err=>{
    setStatus('off', t('st.noWebMidi'));
    el('rigName').textContent = t('st.noWebMidi');
    el('rigMeta').textContent=String(err.name||err);
  });
}

if(window.webkit?.messageHandlers?.kemper) initNative();
else if(navigator.requestMIDIAccess)        initWebMidi();
else {
  setStatus('off', t('st.noMidi'));
  el('rigName').textContent = t('st.noMidi');
  el('rigMeta').textContent = t('msg.iosApp');
}

applyLang();

if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
